name: Weekly Superlatives Recap

on:
  schedule:
    # 13:00 UTC every Tuesday = 9am ET (EDT, Weeks ~1–8) / 8am ET (EST, Weeks ~9–14),
    # always after Monday Night Football finalizes. The script itself gates to Weeks 1–14.
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional: force a specific NFL week (bypasses the Weeks 1–14 gate)'
        required: false
        type: string

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Send the weekly recap
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            npx tsx src/recap.ts --week "${{ inputs.week }}"
          else
            npx tsx src/recap.ts
          fi
        env:
          LEAGUE_SECRETS_JSON: ${{ secrets.LEAGUE_SECRETS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}

      # Per-league failures are alerted from inside recap.ts (one alert per failed league, to
      # OWNER_ALERT_EMAIL). This step is only a last-resort net for a whole-job crash before
      # that logic could even run (e.g. `npm ci` failing) — it can't know which league failed.
      - name: Email me if the whole job crashed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "${EMAIL_FROM:-onboarding@resend.dev}" \
              --arg to "$OWNER_ALERT_EMAIL" \
              --arg url "$RUN_URL" \
              '{from:$from, to:$to, subject:"⚠️ Fantasy recap job CRASHED",
                text:("The fantasy superlatives job failed before it could run any league. Check the run logs:\n" + $url)}')"
