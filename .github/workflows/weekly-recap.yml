name: Weekly Superlatives Recap
# Runs triggered by the external 9am scheduler get a fixed title so the fallback guard can find them.
run-name: ${{ inputs.source == 'external-9am' && 'Weekly recap (9am trigger)' || github.workflow }}

on:
  # The on-time 9am ET send comes from cron-job.org calling this workflow's dispatch API
  # (with source=external-9am) — GitHub's own scheduler routinely starts runs 4–6 hours late.
  # This schedule is only a fallback in case that external trigger didn't fire; the guard step
  # below skips it when the 9am run already happened. The script itself gates to Weeks 1–14.
  schedule:
    - cron: '0 11 * * 2'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional: force a specific NFL week (bypasses the Weeks 1–14 gate)'
        required: false
        type: string
      source:
        description: 'Set to "external-9am" by the external scheduler; leave blank for manual runs'
        required: false
        type: string

# Never let two recap runs overlap (e.g. the 9am trigger and the fallback firing together).
concurrency:
  group: weekly-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # On the fallback schedule, skip if today's 9am-triggered run already happened (see src/guard.ts).
      # Manual dispatches always proceed.
      - id: guard
        run: npx tsx src/guard.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Send the weekly recap
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            npx tsx src/recap.ts --week "${{ inputs.week }}"
          else
            npx tsx src/recap.ts
          fi
        env:
          LEAGUE_SECRETS_JSON: ${{ secrets.LEAGUE_SECRETS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}

      # Per-league failures are alerted from inside recap.ts (one alert per failed league, to
      # OWNER_ALERT_EMAIL). This step is only a last-resort net for a whole-job crash before
      # that logic could even run (e.g. `npm ci` failing) — it can't know which league failed.
      - name: Email me if the whole job crashed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
        run: |
          bash .github/scripts/send-crash-alert.sh "⚠️ Fantasy recap job CRASHED" \
            "The fantasy superlatives job failed before it could run any league. Check the run logs:"
